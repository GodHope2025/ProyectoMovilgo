<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecera('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: menu}"></nav>
<main class="container py-5" style="max-width: 460px">
  <h1 class="h3 fw-bold mb-4">Iniciar sesión</h1>
  <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}">Mensaje</div>
  <div class="alert alert-danger" th:if="${param.error}">
    Correo o contraseña incorrectos. Después de 5 intentos fallidos la cuenta se bloquea por seguridad.
  </div>
  <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
    <label class="form-label" for="username">Correo</label>
    <input class="form-control mb-3" type="email" id="username" name="username" required autofocus autocomplete="username">
    <label class="form-label" for="password">Contraseña</label>
    <div class="input-group mb-4">
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      <button class="btn btn-outline-secondary" type="button" data-mostrar-clave="password" aria-label="Mostrar contraseña">
        <i class="bi bi-eye"></i></button>
    </div>
    <button class="btn mg-btn w-100" type="submit">Ingresar</button>
  </form>
  <p class="mt-3 text-center">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
<footer th:replace="~{fragmentos/layout :: pie}"></footer>
</body>
</html>
