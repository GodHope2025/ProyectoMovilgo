<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · MovilGo Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/movilgo.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark mg-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-truck-front-fill me-2"></i>MovilGo Perú</a>
    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar sesión</a>
  </div>
</nav>
<header class="mg-hero py-5">
  <div class="container">
    <h1 class="fw-bold">Catálogo de vehículos</h1>
    <p class="lead mb-0">Camionetas 4x4, buses, autos y scooters para minería, empresas y personas.</p>
  </div>
</header>
<main class="container py-4">
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" th:each="v : ${vehiculos}">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <span class="badge mg-badge mb-2" th:text="${v.categoria}">Camioneta</span>
          <h5 class="card-title" th:text="|${v.marca} ${v.modelo}|">Toyota Hilux</h5>
          <p class="mb-2"><span class="fs-4 fw-bold mg-precio" th:text="|S/ ${v.precioDia}|">S/ 320</span> <small class="text-muted">por día</small></p>
          <span class="badge text-bg-success" th:text="${v.estado}">DISPONIBLE</span>
        </div>
        <div class="card-footer bg-white border-0 pb-3">
          <a href="#" class="btn mg-btn w-100">Reservar</a>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="text-center text-muted small py-4">MovilGo Perú · Grupo 7 · Spring Boot + Thymeleaf + Bootstrap</footer>
</body>
</html>
