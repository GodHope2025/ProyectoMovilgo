<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos comunes (estándar de diseño 3.6 B): cabecera, menú y pie -->
<head th:fragment="cabecera(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${titulo} · MovilGo Perú|">MovilGo Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/movilgo.css}" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
</head>
<body>
<nav th:fragment="menu" class="navbar navbar-expand-md navbar-dark mg-nav">
  <div class="container">
    <a class="navbar-brand fw-bold mg-marca d-flex align-items-center gap-2" th:href="@{/}"><img class="mg-logo" th:src="@{/img/logo.svg}" alt="">MovilGo <span>Perú</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/catalogo}">Catálogo</a></li>
        <li class="nav-item" th:if="${esCliente}"><a class="nav-link" th:href="@{/reservas}">Mis reservas</a></li>
        <li class="nav-item" th:if="${esPersonal}"><a class="nav-link" th:href="@{/admin}">Panel de alquileres</a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center" th:unless="${autenticado}">
        <a class="btn btn-outline-light btn-sm" th:href="@{/registro}">Crear cuenta</a>
        <a class="btn mg-btn btn-sm" th:href="@{/login}">Iniciar sesión</a>
      </div>
      <form class="d-flex gap-2 align-items-center" th:if="${autenticado}" th:action="@{/logout}" method="post">
        <span class="text-white-50 small" th:text="${usuarioActual}">usuario</span>
        <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
      </form>
    </div>
  </div>
</nav>
<footer th:fragment="pie" class="mg-pie text-center small py-4 mt-4">
  <div class="container">
    <p class="mb-1"><img th:src="@{/img/logo.svg}" alt="" width="22" height="22" class="me-1 align-text-bottom"><strong>MovilGo Perú</strong> · Alquiler de vehículos para minería, empresas y personas · Arequipa</p>
    <p class="mb-0 text-white-50">Grupo 7 · Implementación de Soluciones para Plataformas Web · Certus</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/movilgo.js}"></script>
</footer>
</body>
</html>
