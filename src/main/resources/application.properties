spring.application.name=movilgo

# Base de datos MySQL de XAMPP (usuario root sin contraseña por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/movilgo_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

# Persistencia (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Alta demanda: hilos virtuales de Java 21
spring.threads.virtual.enabled=true

# Thymeleaf sin caché durante el desarrollo
spring.thymeleaf.cache=false
