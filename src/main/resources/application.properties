spring.application.name=movilgo

# Base de datos: XAMPP en local; en la nube se toma de las variables de entorno DB_URL, DB_USER y DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movilgo_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Persistencia (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
spring.datasource.hikari.minimum-idle=2

# Alta demanda: hilos virtuales de Java 21
spring.threads.virtual.enabled=true

# Servidor: Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

# Thymeleaf: sin caché en desarrollo, con caché en producción
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Salud de la aplicación para el despliegue continuo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
